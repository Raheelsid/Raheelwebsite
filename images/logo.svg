<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="500" fill="none"/>
  
  <!-- RS Logo -->
  <g transform="translate(150, 120)">
    <!-- R Letter -->
    <path d="M 30 20 L 30 140 M 30 20 L 70 20 Q 90 20 90 40 Q 90 60 70 60 L 30 60 M 70 60 L 95 140" 
          stroke="#000" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- S Letter with swoosh -->
    <path d="M 140 40 Q 120 20 100 20 Q 80 20 80 40 Q 80 55 100 60 Q 120 65 120 80 Q 120 100 100 100 Q 80 100 60 85" 
          stroke="#000" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100 60 Q 130 70 150 100 L 170 130 L 140 100" 
          stroke="#000" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text underneath -->
  <text x="250" y="320" font-family="'Cormorant Garamond', serif" font-size="32" font-weight="400" text-anchor="middle" letter-spacing="3">RAHEEL</text>
  <text x="250" y="360" font-family="'Cormorant Garamond', serif" font-size="32" font-weight="400" text-anchor="middle" letter-spacing="3">SIDDIQUI</text>
</svg>